name: Deploy Next.js to Netlify

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # npm 10 crashes with a cryptic 'edgesOut' error on an out-of-sync lockfile,
      # so check it first and fail with a readable message.
      - name: Check package-lock.json is in sync
        run: npm run check:lockfile
        working-directory: apps/web

      # npm ci installs exactly what package-lock.json pins and never rewrites it.
      - name: Install dependencies
        run: npm ci
        working-directory: apps/web

      - name: Build with Netlify
        run: npx netlify build
        working-directory: apps/web
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

      - name: Deploy to Netlify
        run: npx netlify deploy --prod --build --cwd apps/web
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
